# Publish docs/ (the site at https://volcano.bristleconelab.org) to Cloudflare Pages, project volcano-detectability.
# Needs the secret CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit; the bristleconelab organization secret).
# Until 2026-11-26 the site was served by GitHub Pages from docs/.
name: deploy
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy docs/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 95c89337261f10f37ac1310191b2ebb7
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN not set: the site was NOT deployed"; exit 1; fi
          site="$PWD/docs"; msg="$(git log -1 --format=%s | head -c 200)"
          # wrangler runs from an empty directory, so it does not try to configure the repository as a Workers project
          mkdir -p "$RUNNER_TEMP/cf" && cd "$RUNNER_TEMP/cf"
          npx --yes wrangler@4.168.0 pages deploy "$site" --project-name volcano-detectability --branch main --commit-hash "$GITHUB_SHA" --commit-message "$msg"
