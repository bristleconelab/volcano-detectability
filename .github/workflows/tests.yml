name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # synthetic tests plus consistency checks of the committed docs/data tables: no downloads, no data/raw needed
      - run: python -I -m unittest discover -s tests -v
